<?xml version="1.0" encoding="UTF-8"?>
<!-- Clippa ワードマーク -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <title>Clippa wordmark</title>
  <defs>
    <linearGradient id="wm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEC4D"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>
    <linearGradient id="wm-clip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <g transform="translate(8 8)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#wm-bg)"/>
    <!-- 紙 -->
    <rect x="14" y="22" width="36" height="34" rx="5" fill="#FFFFFF"/>
    <!-- クリップ部分 -->
    <rect x="24" y="14" width="16" height="10" rx="2.5" fill="url(#wm-clip)" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="32" cy="19" r="1.8" fill="#1A1A1A"/>
    <!-- 紙の内容 -->
    <rect x="18" y="28" width="22" height="3" rx="1" fill="#1A1A1A"/>
    <rect x="18" y="34" width="18" height="1.5" rx="0.7" fill="#D5D5D5"/>
    <rect x="18" y="37.5" width="24" height="1.5" rx="0.7" fill="#D5D5D5"/>
    <!-- ハイライト行 -->
    <rect x="16" y="42" width="32" height="6" rx="2" fill="#1A1A1A"/>
    <rect x="19" y="44" width="20" height="1.5" rx="0.7" fill="#FFD60A"/>
    <!-- 下行 -->
    <rect x="18" y="50.5" width="20" height="1.5" rx="0.7" fill="#D5D5D5"/>
  </g>

  <g fill="#1A1A1A" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
     font-weight="700" font-size="36" letter-spacing="-1">
    <text x="88" y="50">Clippa</text>
  </g>
  <g fill="#7A4B0A" font-family="-apple-system, 'SF Pro Text', sans-serif"
     font-size="10" letter-spacing="2.4" font-weight="500">
    <text x="89" y="64">CLIPBOARD HISTORY</text>
  </g>
</svg>
