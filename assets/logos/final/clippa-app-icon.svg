<?xml version="1.0" encoding="UTF-8"?>
<!--
  Clippa 公式アプリアイコン
  - ポップな黄色背景
  - 板 + 厚みのある紙（3 層）+ 金属クリップ
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Clippa</title>
  <defs>
    <!-- 黄色背景 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEC4D"/>
      <stop offset="50%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </linearGradient>

    <!-- クリップボードの板 (深いウォルナット調) -->
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A57338"/>
      <stop offset="20%" stop-color="#824A14"/>
      <stop offset="55%" stop-color="#5C3208"/>
      <stop offset="100%" stop-color="#2E1A00"/>
    </linearGradient>
    <linearGradient id="boardHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE0A8" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="boardEdgeShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 銀色クリップ (高級ブラッシュドメタル) -->
    <linearGradient id="metalClip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="22%" stop-color="#E8E8E8"/>
      <stop offset="55%" stop-color="#A8A8A8"/>
      <stop offset="85%" stop-color="#707070"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
    <linearGradient id="metalClipDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B5B5B5"/>
      <stop offset="100%" stop-color="#3D3D3D"/>
    </linearGradient>
    <radialGradient id="metalRivet" cx="0.3" cy="0.3" r="0.75">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#D5D5D5"/>
      <stop offset="80%" stop-color="#6A6A6A"/>
      <stop offset="100%" stop-color="#2A2A2A"/>
    </radialGradient>

    <!-- 紙 (上面用、微妙にグラデで立体感) -->
    <linearGradient id="paperTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FCFCFC"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
    <!-- 紙 (下層、わずかに暗めの白) -->
    <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0F0F0"/>
      <stop offset="100%" stop-color="#DCDCDC"/>
    </linearGradient>
    <!-- 紙の上端ハイライト -->
    <linearGradient id="paperHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- 影フィルター -->
    <filter id="boardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="26"/>
      <feOffset dx="0" dy="24"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="paperShadow1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="paperShadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="3" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- ボード内側の凹み影（紙が乗る溝） -->
    <filter id="boardInset" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1"/>
      <feFlood flood-color="#000000" flood-opacity="0.5"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="clipShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- 黄色 squircle -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- 上半分の薄い光 -->
  <rect x="64" y="64" width="896" height="448" rx="200"
        fill="#FFFFFF" opacity="0.15" pointer-events="none"/>
  <!-- 内側ボーダー -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none"
        stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>

  <!-- コンポジションを天地中央に -->
  <g transform="translate(0 -64)">

    <!-- ============================================ -->
    <!-- クリップボードの板 (ウォルナット高級仕上げ)    -->
    <!-- ============================================ -->
    <g filter="url(#boardShadow)">
      <!-- 板本体 -->
      <rect x="200" y="260" width="624" height="680" rx="36" fill="url(#board)"/>

      <!-- 木目テクスチャ (薄い水平ライン) -->
      <g opacity="0.18" clip-path="inset(0 round 36px)">
        <path d="M 200 350 Q 512 348 824 354" stroke="#5C3A00" stroke-width="1.5" fill="none"/>
        <path d="M 200 420 Q 512 422 824 416" stroke="#3D1F00" stroke-width="1.2" fill="none"/>
        <path d="M 200 510 Q 512 514 824 508" stroke="#5C3A00" stroke-width="1.3" fill="none"/>
        <path d="M 200 590 Q 512 586 824 594" stroke="#3D1F00" stroke-width="1.5" fill="none"/>
        <path d="M 200 680 Q 512 684 824 678" stroke="#5C3A00" stroke-width="1.2" fill="none"/>
        <path d="M 200 760 Q 512 756 824 762" stroke="#3D1F00" stroke-width="1.4" fill="none"/>
        <path d="M 200 850 Q 512 854 824 848" stroke="#5C3A00" stroke-width="1.3" fill="none"/>
      </g>

      <!-- 上部の光沢 (シルキーな反射) -->
      <rect x="200" y="260" width="624" height="180" rx="36" fill="url(#boardHi)"/>

      <!-- 縁のベベル：内側に細い光のライン (高級木材の艶) -->
      <rect x="206" y="266" width="612" height="668" rx="32" fill="none"
            stroke="#FFE0A8" stroke-width="1.2" opacity="0.35"/>
      <rect x="210" y="270" width="604" height="660" rx="30" fill="none"
            stroke="#000000" stroke-width="2" opacity="0.45"/>
      <rect x="214" y="274" width="596" height="652" rx="28" fill="none"
            stroke="#FFFFFF" stroke-width="1" opacity="0.12"/>

      <!-- 上端の長いハイライト線（鏡面仕上げ感） -->
      <rect x="244" y="276" width="536" height="3" rx="1.5" fill="#FFE0A8" opacity="0.5"/>

      <!-- 紐穴 (金属リング付き) -->
      <circle cx="512" cy="300" r="14" fill="#000000" opacity="0.4"/>
      <circle cx="512" cy="298" r="11" fill="url(#metalRivet)"/>
      <circle cx="512" cy="298" r="6" fill="#1A0E00"/>
      <circle cx="510" cy="296" r="2.5" fill="#FFE0A8" opacity="0.7"/>
    </g>

    <!-- ============================================ -->
    <!-- 紙 (3 層スタック: 右下方向に重なる)             -->
    <!-- 板に対して紙を一回り小さくして、板の縁を見せる   -->
    <!-- ============================================ -->

    <!-- 後ろの紙 (右下に大きくはみ出る) -->
    <g filter="url(#paperShadow2)" transform="translate(16 14)">
      <rect x="260" y="350" width="504" height="540" rx="12" fill="url(#paperBack)"/>
      <!-- 右端の影 -->
      <rect x="752" y="364" width="12" height="510" fill="#000000" opacity="0.08"/>
    </g>

    <!-- 中間の紙 (右下にはみ出る) -->
    <g filter="url(#paperShadow2)" transform="translate(8 7)">
      <rect x="260" y="350" width="504" height="540" rx="12" fill="#F0F0F0"/>
      <rect x="752" y="364" width="12" height="510" fill="#000000" opacity="0.06"/>
    </g>

    <!-- 前面の紙 (本体) -->
    <g filter="url(#paperShadow1)">
      <rect x="260" y="350" width="504" height="540" rx="12" fill="url(#paperTop)"/>
      <!-- 紙の上端ハイライト -->
      <rect x="260" y="350" width="504" height="60" rx="12" fill="url(#paperHi)"/>
      <!-- 紙の左端ハイライト -->
      <rect x="260" y="362" width="4" height="516" fill="#FFFFFF" opacity="0.7"/>
      <!-- 紙の右端の微かなシェード -->
      <rect x="750" y="362" width="14" height="516" fill="#000000" opacity="0.05"/>
      <!-- 紙の下端の微かな影 -->
      <rect x="260" y="876" width="504" height="14" rx="12" fill="#000000" opacity="0.04"/>
    </g>

    <!-- ============================================ -->
    <!-- 金属クリップ                                   -->
    <!-- ============================================ -->
    <g filter="url(#clipShadow)">
      <!-- 本体 -->
      <path d="
        M 388 232
        L 636 232
        Q 660 232 660 256
        L 660 348
        Q 660 372 636 372
        L 388 372
        Q 364 372 364 348
        L 364 256
        Q 364 232 388 232 Z
      " fill="url(#metalClip)"/>
      <!-- 上部の強いハイライト -->
      <rect x="380" y="242" width="264" height="14" rx="6" fill="#FFFFFF" opacity="0.75"/>
      <rect x="396" y="260" width="232" height="6" rx="3" fill="#FFFFFF" opacity="0.4"/>
      <!-- 中央のスロット (バネのメカ表現) -->
      <rect x="392" y="316" width="240" height="8" rx="4" fill="url(#metalClipDark)"/>
      <!-- 押すレバー -->
      <rect x="460" y="258" width="104" height="42" rx="14" fill="url(#metalClipDark)"/>
      <rect x="472" y="268" width="80" height="14" rx="6" fill="#FFFFFF" opacity="0.45"/>
      <!-- リベット -->
      <circle cx="412" cy="352" r="7" fill="url(#metalRivet)"/>
      <circle cx="612" cy="352" r="7" fill="url(#metalRivet)"/>
      <!-- クリップ下部の影で紙との段差を強調 -->
      <rect x="364" y="370" width="296" height="4" rx="2" fill="#000000" opacity="0.18"/>
    </g>

    <!-- ============================================ -->
    <!-- 紙の中身（紙サイズ 504×540 内に収める）         -->
    <!-- ============================================ -->

    <!-- 上部: アイコン + タイトル -->
    <g>
      <rect x="284" y="396" width="34" height="42" rx="4" fill="#FFD60A"/>
      <rect x="290" y="406" width="22" height="3" rx="1" fill="#1A1A1A"/>
      <rect x="290" y="414" width="18" height="3" rx="1" fill="#1A1A1A"/>
      <rect x="290" y="422" width="20" height="3" rx="1" fill="#1A1A1A"/>
      <rect x="290" y="430" width="16" height="3" rx="1" fill="#1A1A1A"/>

      <rect x="332" y="400" width="260" height="14" rx="3" fill="#1A1A1A"/>
      <rect x="332" y="422" width="170" height="9" rx="2.5" fill="#A8A8A8"/>
    </g>

    <line x1="284" y1="464" x2="740" y2="464" stroke="#EEEEEE" stroke-width="2"/>

    <!-- 段落 1 -->
    <g>
      <rect x="284" y="484" width="440" height="11" rx="3" fill="#3A3A3A"/>
      <rect x="284" y="504" width="390" height="11" rx="3" fill="#3A3A3A"/>
      <rect x="284" y="524" width="360" height="11" rx="3" fill="#3A3A3A"/>
      <rect x="284" y="544" width="280" height="11" rx="3" fill="#3A3A3A"/>
    </g>

    <!-- ハイライト行 -->
    <g>
      <rect x="274" y="576" width="476" height="56" rx="12" fill="#1A1A1A"/>
      <rect x="290" y="594" width="22" height="22" rx="4" fill="#FFD60A"/>
      <rect x="324" y="596" width="270" height="11" rx="2.5" fill="#FFFFFF"/>
      <rect x="324" y="614" width="190" height="8" rx="2" fill="#FFE38A" opacity="0.85"/>
      <rect x="700" y="594" width="34" height="16" rx="3" fill="#FFD60A"/>
    </g>

    <!-- 段落 2 -->
    <g>
      <rect x="284" y="656" width="380" height="11" rx="3" fill="#A8A8A8"/>
      <rect x="284" y="676" width="420" height="11" rx="3" fill="#A8A8A8"/>
      <rect x="284" y="696" width="340" height="11" rx="3" fill="#A8A8A8"/>
    </g>

    <!-- チェックリスト -->
    <g>
      <circle cx="294" cy="740" r="6.5" fill="none" stroke="#3A3A3A" stroke-width="2"/>
      <rect x="312" y="735" width="280" height="11" rx="2.5" fill="#3A3A3A"/>

      <circle cx="294" cy="768" r="6.5" fill="#1A1A1A"/>
      <path d="M 291 768 L 293.5 770.5 L 297 766" fill="none" stroke="#FFD60A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="312" y="763" width="170" height="11" rx="2.5" fill="#A8A8A8"/>
      <line x1="312" y1="768.5" x2="482" y2="768.5" stroke="#A8A8A8" stroke-width="1.5"/>

      <circle cx="294" cy="796" r="6.5" fill="none" stroke="#3A3A3A" stroke-width="2"/>
      <rect x="312" y="791" width="320" height="11" rx="2.5" fill="#3A3A3A"/>

      <circle cx="294" cy="824" r="6.5" fill="none" stroke="#3A3A3A" stroke-width="2"/>
      <rect x="312" y="819" width="240" height="11" rx="2.5" fill="#3A3A3A"/>
    </g>
  </g>
</svg>
