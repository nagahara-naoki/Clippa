name: Clippa
options:
  deploymentTarget:
    macOS: "12.0"
  bundleIdPrefix: app.clippa
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "12.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # ← Apple Developer Team ID をここに
    ENABLE_HARDENED_RUNTIME: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    OTHER_LDFLAGS:
      - -lsqlite3

targets:
  Clippa:
    type: application
    platform: macOS
    sources:
      - path: Sources/Clippa
      - path: Resources/Localizable
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true  # メニューバーアプリ（Dock 非表示）
        NSHumanReadableCopyright: "Copyright © 2026 Clippa. All rights reserved."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppleEventsUsageDescription: "Clippa needs permission to paste selected items into other apps."
        NSPasteboardUsageDescription: "Clippa watches the clipboard to save your local history."
    entitlements:
      path: Resources/Clippa.entitlements
      properties:
        com.apple.security.app-sandbox: false  # アクセシビリティ API のため sandbox 無効
        com.apple.security.automation.apple-events: true

  ClippaTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests/ClippaTests
    dependencies:
      - target: Clippa

schemes:
  Clippa:
    build:
      targets:
        Clippa: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClippaTests
    archive:
      config: Release
