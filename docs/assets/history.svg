<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Clippa history window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3bc"/>
      <stop offset="1" stop-color="#ffd60a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#2b2100" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1200" height="820" rx="36" fill="url(#bg)"/>
  <g filter="url(#shadow)" transform="translate(280 90)">
    <rect width="640" height="640" rx="30" fill="#ffffff" opacity=".96"/>
    <rect x="0" y="0" width="640" height="58" rx="30" fill="#16181d"/>
    <text x="162" y="38" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#ffd60a" text-anchor="middle">History</text>
    <text x="480" y="38" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#9aa0aa" text-anchor="middle">Text</text>
    <g transform="translate(24 80)">
      <rect width="592" height="46" rx="14" fill="#f2f3f5"/>
      <text x="22" y="30" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="17" fill="#737986">Search history...</text>
    </g>
    <g font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
      <g transform="translate(24 150)">
        <rect width="592" height="76" rx="16" fill="#fff4c5"/>
        <rect x="18" y="18" width="40" height="40" rx="10" fill="#2f6fec"/>
        <text x="38" y="45" font-size="18" fill="#fff" text-anchor="middle" font-weight="800">T</text>
        <text x="76" y="34" font-size="20" font-weight="800" fill="#17191f">Release note headline</text>
        <text x="76" y="58" font-size="14" fill="#747b86">Copied just now</text>
        <text x="558" y="46" font-size="14" fill="#747b86" font-family="ui-monospace,Menlo,monospace">1</text>
      </g>
      <g transform="translate(24 238)">
        <rect width="592" height="76" rx="16" fill="#fafafa"/>
        <rect x="18" y="18" width="40" height="40" rx="10" fill="#f16b4f"/>
        <text x="38" y="45" font-size="18" fill="#fff" text-anchor="middle" font-weight="800">I</text>
        <text x="76" y="34" font-size="20" font-weight="800" fill="#17191f">Screenshot 1440x900</text>
        <text x="76" y="58" font-size="14" fill="#747b86">Image thumbnail</text>
        <text x="558" y="46" font-size="14" fill="#747b86" font-family="ui-monospace,Menlo,monospace">2</text>
      </g>
      <g transform="translate(24 326)">
        <rect width="592" height="76" rx="16" fill="#fafafa"/>
        <rect x="18" y="18" width="40" height="40" rx="10" fill="#2ea86b"/>
        <text x="38" y="45" font-size="18" fill="#fff" text-anchor="middle" font-weight="800">U</text>
        <text x="76" y="34" font-size="20" font-weight="800" fill="#17191f">https://github.com/nagahara-naoki/Clippa</text>
        <text x="76" y="58" font-size="14" fill="#747b86">Safari - 3m ago</text>
        <text x="558" y="46" font-size="14" fill="#747b86" font-family="ui-monospace,Menlo,monospace">3</text>
      </g>
      <g transform="translate(24 414)">
        <rect width="592" height="76" rx="16" fill="#fafafa"/>
        <rect x="18" y="18" width="40" height="40" rx="10" fill="#f4b400"/>
        <text x="38" y="45" font-size="18" fill="#17191f" text-anchor="middle" font-weight="900">Q</text>
        <text x="76" y="34" font-size="20" font-weight="800" fill="#17191f">Paste queue content</text>
        <text x="76" y="58" font-size="14" fill="#747b86">Notes - 8m ago</text>
        <text x="558" y="46" font-size="14" fill="#747b86" font-family="ui-monospace,Menlo,monospace">4</text>
      </g>
    </g>
    <line x1="0" y1="560" x2="640" y2="560" stroke="#e8e8e8"/>
    <text x="320" y="600" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="15" fill="#747b86" text-anchor="middle">Return to paste - Space to preview</text>
  </g>
</svg>
