<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Clippa saved text window">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f7ff"/>
      <stop offset="1" stop-color="#ffd60a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#1b2330" flood-opacity=".20"/>
    </filter>
  </defs>
  <rect width="1200" height="820" rx="36" fill="url(#bg)"/>
  <g transform="translate(92 138)" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
    <text x="0" y="0" font-size="52" font-weight="900" fill="#111215">Reusable text,</text>
    <text x="0" y="58" font-size="52" font-weight="900" fill="#111215">ready anywhere.</text>
    <text x="0" y="118" font-size="22" fill="#4b5260">Save phrases, templates, and tiny notes.</text>
  </g>
  <g filter="url(#shadow)" transform="translate(560 96)">
    <rect width="520" height="626" rx="30" fill="#fff"/>
    <rect x="0" y="0" width="520" height="58" rx="30" fill="#17191f"/>
    <text x="130" y="38" font-size="19" font-weight="700" fill="#9aa0aa" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">History</text>
    <text x="390" y="38" font-size="19" font-weight="800" fill="#ffd60a" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">Text</text>
    <g transform="translate(24 84)" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
      <rect width="472" height="46" rx="14" fill="#f2f3f5"/>
      <text x="20" y="30" font-size="17" fill="#737986">Search saved text...</text>
      <circle cx="438" cy="23" r="15" fill="#111215"/>
      <text x="438" y="30" font-size="22" fill="#ffd60a" text-anchor="middle" font-weight="800">+</text>
    </g>
    <g transform="translate(24 158)" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
      <rect width="472" height="84" rx="16" fill="#fff4c5"/>
      <rect x="18" y="20" width="44" height="44" rx="12" fill="#ffd60a"/>
      <text x="40" y="50" font-size="20" fill="#111215" text-anchor="middle" font-weight="900">T</text>
      <text x="82" y="38" font-size="20" fill="#111215" font-weight="850">Meeting follow-up</text>
      <text x="82" y="64" font-size="14" fill="#737986">Thanks for your time today...</text>
    </g>
    <g transform="translate(24 258)" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
      <rect width="472" height="84" rx="16" fill="#fafafa"/>
      <rect x="18" y="20" width="44" height="44" rx="12" fill="#2f6fec"/>
      <text x="40" y="50" font-size="20" fill="#fff" text-anchor="middle" font-weight="900">@</text>
      <text x="82" y="38" font-size="20" fill="#111215" font-weight="850">Support reply</text>
      <text x="82" y="64" font-size="14" fill="#737986">Could you try the latest build?</text>
    </g>
    <g transform="translate(24 358)" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
      <rect width="472" height="156" rx="16" fill="#17191f"/>
      <text x="22" y="40" font-size="18" fill="#ffd60a" font-weight="800">Template preview</text>
      <text x="22" y="78" font-size="16" fill="#fff" font-family="ui-monospace,Menlo,monospace">Today: {date}</text>
      <text x="22" y="108" font-size="16" fill="#fff" font-family="ui-monospace,Menlo,monospace">Clipboard: {clipboard}</text>
      <text x="22" y="138" font-size="16" fill="#fff" font-family="ui-monospace,Menlo,monospace">Cursor: {cursor}</text>
    </g>
  </g>
</svg>
