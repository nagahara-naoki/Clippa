<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Clippa preview overlay">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6d4"/>
      <stop offset="1" stop-color="#edf2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#14161b" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="820" rx="36" fill="url(#bg)"/>
  <g transform="translate(150 110)" opacity=".38">
    <rect width="420" height="560" rx="28" fill="#fff"/>
    <rect x="28" y="82" width="364" height="54" rx="14" fill="#fff4c5"/>
    <rect x="28" y="154" width="364" height="54" rx="14" fill="#f4f4f4"/>
    <rect x="28" y="226" width="364" height="54" rx="14" fill="#f4f4f4"/>
  </g>
  <g filter="url(#shadow)" transform="translate(310 120)">
    <rect width="580" height="580" rx="30" fill="#fff"/>
    <g transform="translate(34 34)" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif">
      <rect width="48" height="48" rx="12" fill="#2f6fec"/>
      <text x="24" y="32" font-size="18" fill="#fff" text-anchor="middle" font-weight="900">T</text>
      <text x="66" y="22" font-size="22" fill="#111215" font-weight="850">Full preview</text>
      <text x="66" y="48" font-size="14" fill="#737986">Press Space to open or close</text>
      <text x="508" y="34" font-size="26" fill="#9aa0aa" text-anchor="end">x</text>
    </g>
    <line x1="34" y1="112" x2="546" y2="112" stroke="#e9e9e9"/>
    <g transform="translate(44 154)" font-family="ui-monospace,Menlo,monospace" font-size="19">
      <text x="0" y="0" fill="#111215">Release checklist</text>
      <text x="0" y="42" fill="#4b5260">- Build the app</text>
      <text x="0" y="84" fill="#4b5260">- Upload zip to GitHub Releases</text>
      <text x="0" y="126" fill="#4b5260">- Update download link</text>
      <text x="0" y="168" fill="#4b5260">- Share the site</text>
      <rect x="0" y="218" width="492" height="118" rx="18" fill="#fff4c5"/>
      <text x="24" y="264" fill="#111215" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="22" font-weight="850">Preview before pasting</text>
      <text x="24" y="300" fill="#5d6470" font-family="-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif" font-size="17">Long text stays readable before it lands in another app.</text>
    </g>
  </g>
</svg>
